<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

// ---------- helpers ----------
let seed = 12345;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rnd();
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const mats = {};
const M = (c, opts = {}) => {
  const key = c + JSON.stringify(opts);
  if (!mats[key]) mats[key] = new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...opts });
  return mats[key];
};
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = false;
  return m;
}
function radialTex(stops, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stripeTex(a, b, n = 8, vertical = false) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? b : a; vertical ? g.fillRect(i * 64 / n, 0, 64 / n, 64) : g.fillRect(0, i * 64 / n, 64, 64 / n); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}

// ================= BEACH SCENE =================
const beach = new THREE.Scene();
beach.fog = new THREE.Fog(0xcfe6f5, 120, 900);

// sky dome
const skyU = { top: { value: new THREE.Color(0x3d8fd6) }, hor: { value: new THREE.Color(0xcfe9f7) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 hor; varying vec3 vP;
    void main(){ float h = clamp(vP.y, 0., 1.); vec3 c = mix(hor, top, pow(h, .55)); gl_FragColor = vec4(c,1.);
    #include <colorspace_fragment>
    }`
}));
beach.add(sky);

// stars
const starGeo = new THREE.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 2600; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2;
    let y = Math.abs(u) * 0.98 + 0.02; const r = Math.sqrt(1 - y * y);
    p.push(Math.cos(th) * r * 1200, y * 1200, Math.sin(th) * r * 1200);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new THREE.Points(starGeo, starMat); beach.add(stars);
const starGeo2 = new THREE.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 500; i++) {
    const u = rnd(), th = rnd() * Math.PI * 2; let y = u * 0.95 + 0.05; const r = Math.sqrt(1 - y * y);
    p.push(Math.cos(th) * r * 1200, y * 1200, Math.sin(th) * r * 1200);
  }
  starGeo2.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const starMat2 = new THREE.PointsMaterial({ color: 0xdfe8ff, size: 4.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars2 = new THREE.Points(starGeo2, starMat2); beach.add(stars2);

// lights
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0xd9c08f, 1.5); beach.add(hemi);
const amb = new THREE.AmbientLight(0x6f86b8, 0); beach.add(amb);
const SUN_DIR = new THREE.Vector3(0.22, 0.86, -0.46).normalize();
const sunL = new THREE.DirectionalLight(0xfff1d6, 2.6);
sunL.position.copy(SUN_DIR).multiplyScalar(120); sunL.target.position.set(0, 0, 10);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300 });
sunL.shadow.bias = -0.0006;
beach.add(sunL, sunL.target);
const pls = [];
for (let i = 0; i < 6; i++) { const l = new THREE.PointLight(0xffffff, 0, 14, 1.6); beach.add(l); pls.push(l); }

// sun + moon in sky
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(26, 40), new THREE.MeshBasicMaterial({ color: 0xfffbe8, fog: false }));
sunDisc.position.copy(SUN_DIR).multiplyScalar(1100); sunDisc.lookAt(0, 0, 0); beach.add(sunDisc);
const glowTex = radialTex([[0, 'rgba(255,250,225,1)'], [0.12, 'rgba(255,240,200,.85)'], [0.35, 'rgba(255,225,160,.25)'], [1, 'rgba(255,220,150,0)']]);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
sunGlow.position.copy(sunDisc.position); sunGlow.scale.set(520, 520, 1); beach.add(sunGlow);
const MOON_DIR = new THREE.Vector3(0.36, 0.40, -0.84).normalize();
const moonMat = new THREE.MeshBasicMaterial({ color: 0xe9eef6, transparent: true, opacity: 0.55, fog: false });
const moon = new THREE.Mesh(new THREE.SphereGeometry(19, 24, 16), moonMat);
moon.position.copy(MOON_DIR).multiplyScalar(1100); beach.add(moon);
// craters
for (let i = 0; i < 7; i++) {
  const c = new THREE.Mesh(new THREE.CircleGeometry(R(2, 4.5), 12), new THREE.MeshBasicMaterial({ color: 0xc5ccd6, transparent: true, opacity: 0.5, fog: false }));
  const a = rnd() * 6.28, r = R(2, 12);
  c.position.set(Math.cos(a) * r, Math.sin(a) * r, 19.2); moon.add(c);
}
moon.lookAt(0, 0, 0); moon.rotateY(Math.PI); // craters face camera side
moon.children.forEach(c => { c.position.z = -19.3; c.rotation.y = Math.PI; });
const moonGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex([[0, 'rgba(220,230,255,.6)'], [0.3, 'rgba(200,215,255,.18)'], [1, 'rgba(200,215,255,0)']]), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0 }));
moonGlow.position.copy(moon.position); moonGlow.scale.set(170, 170, 1); beach.add(moonGlow);

// clouds
const clouds = new THREE.Group(); beach.add(clouds);
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, emissive: 0x555555 });
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group();
  const n = 3 + Math.floor(rnd() * 3);
  for (let j = 0; j < n; j++) {
    const s = R(10, 20);
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), cloudMat);
    m.position.set(j * 16 - n * 8 + R(-3, 3), R(-3, 4), R(-4, 4)); m.scale.y = 0.6; g.add(m);
  }
  const a = R(-1.3, 1.3);
  g.position.set(Math.sin(a) * 600, R(110, 230), -Math.cos(a) * 600 - 100);
  g.lookAt(0, g.position.y, 0);
  clouds.add(g);
}

// sand
const sandGeo = new THREE.PlaneGeometry(700, 240, 140, 48); sandGeo.rotateX(-Math.PI / 2); sandGeo.translate(0, 0, 118);
{
  const p = sandGeo.attributes.position; const cols = [];
  const c1 = new THREE.Color(0xead2a0), c2 = new THREE.Color(0xc9a978);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    let y = (z - 0) * 0.025 + Math.sin(x * 0.11) * 0.12 + Math.cos(z * 0.23 + x * 0.05) * 0.1 + R(-0.06, 0.06);
    if (z > 60) y += (z - 60) * 0.12;
    p.setY(i, y);
    const wet = smooth(5, 0, z);
    const c = c1.clone().lerp(c2, wet); cols.push(c.r, c.g, c.b);
  }
  sandGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  sandGeo.computeVertexNormals();
}
const sandMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const sand = new THREE.Mesh(sandGeo, sandMat); sand.receiveShadow = true; beach.add(sand);
const sandY = (x, z) => z * 0.025 + Math.sin(x * 0.11) * 0.12 + Math.cos(z * 0.23 + x * 0.05) * 0.1;

// ocean (near, animated)
const oceanGeo = new THREE.PlaneGeometry(700, 260, 120, 60); oceanGeo.rotateX(-Math.PI / 2); oceanGeo.translate(0, 0, -128);
const oceanBase = Float32Array.from(oceanGeo.attributes.position.array);
const oceanMat = new THREE.MeshLambertMaterial({ color: 0x2a86b5, flatShading: true });
const ocean = new THREE.Mesh(oceanGeo, oceanMat); ocean.receiveShadow = true; beach.add(ocean);
const farSea = new THREE.Mesh(new THREE.PlaneGeometry(4000, 1600), new THREE.MeshLambertMaterial({ color: 0x1f6f9c }));
farSea.rotation.x = -Math.PI / 2; farSea.position.set(0, -0.3, -1050); beach.add(farSea);
function waveY(x, z, t, amp) {
  const d = -z;
  return amp * (0.35 * Math.sin(x * 0.08 + t * 0.9 + z * 0.05) + 0.3 * Math.sin(z * 0.21 + t * 1.7) + 0.18 * Math.sin((x + z) * 0.15 - t * 1.2)) * smooth(0, 25, d) - 0.15;
}
function updateOcean(t, amp) {
  const p = oceanGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
    p.setY(i, waveY(x, z, t, amp));
  }
  p.needsUpdate = true; oceanGeo.computeVertexNormals();
}
// foam lines (breaking waves)
const foamMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, emissive: 0x666666, flatShading: true });
const foams = [];
for (let i = 0; i < 5; i++) {
  const g = new THREE.BoxGeometry(700, 0.25, 1.4, 70, 1, 1);
  const pos = g.attributes.position;
  for (let k = 0; k < pos.count; k++) pos.setZ(k, pos.getZ(k) + Math.sin(pos.getX(k) * 0.07 + i) * 1.2 + Math.sin(pos.getX(k) * 0.23) * 0.4);
  const f = new THREE.Mesh(g, foamMat.clone()); beach.add(f); foams.push({ m: f, ph: i / 5 });
}
function updateFoam(t, on) {
  foams.forEach(f => {
    const k = ((t * 0.09 + f.ph) % 1);
    f.m.position.set(0, 0.05 + 0.2 * (1 - k), lerp(-34, 1.5, k));
    f.m.scale.z = lerp(1.6, 2.4, k);
    f.m.material.opacity = on * (k < 0.85 ? smooth(0, 0.25, k) * 0.85 : (1 - k) / 0.15 * 0.85);
    f.m.visible = on > 0.01;
  });
}

// headlands
function headland(cx, cz, w, d, h, seedOff) {
  const g = new THREE.Group();
  const rock = M(0xb98b5c), rock2 = M(0xa4764b), grass = M(0x6b8a45);
  for (let i = 0; i < 14; i++) {
    const s = R(0.6, 1);
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), i % 3 ? rock : rock2);
    m.scale.set(w * R(0.18, 0.32), h * s, d * R(0.25, 0.4));
    m.position.set(cx + R(-w / 2, w / 2), h * s * 0.35, cz + R(-d / 2, d / 2));
    m.rotation.y = R(0, 6); g.add(m);
    const top = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), grass);
    top.scale.set(m.scale.x * 0.9, h * 0.18, m.scale.z * 0.9);
    top.position.set(m.position.x, m.position.y + m.scale.y * 0.78, m.position.z); top.rotation.y = m.rotation.y; g.add(top);
  }
  return g;
}
const north = headland(230, -150, 170, 140, 46); beach.add(north);
const south = headland(-240, -140, 170, 130, 40); beach.add(south);
// houses on hills (with night windows)
const winMats = [];
const winMat = new THREE.MeshBasicMaterial({ color: 0xffd58a, transparent: true, opacity: 0 });
const houses = new THREE.Group(); beach.add(houses);
for (let i = 0; i < 70; i++) {
  const side = i % 2 ? 1 : -1;
  const x = side * R(150, 330), z = R(-240, -60) + (side > 0 ? 0 : 10);
  const y = R(30, 52) * smooth(330, 160, Math.abs(x)) + 8;
  const w = R(6, 12), hh = R(5, 10), dd = R(6, 10);
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, hh, dd), M(pick([0xf3eee2, 0xe8e2d4, 0xf6f1e8, 0xd9d1c2, 0xeadfcc])));
  b.position.set(x, y + hh / 2, z); houses.add(b);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, dd) * 0.75, 3, 4), M(pick([0xb5543a, 0xa04a34, 0x7c7f86])));
  roof.rotation.y = Math.PI / 4; roof.position.set(x, y + hh + 1.5, z); houses.add(roof);
  for (let k = 0; k < 2; k++) {
    const wn = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.4), winMat);
    wn.position.set(x + (k - 0.5) * w * 0.45, y + hh * 0.55, z + dd / 2 + 0.05); houses.add(wn);
  }
}

// lifeguard tower
const tower = new THREE.Group(); beach.add(tower);
{
  const blue = M(0x2d5fa3), yel = M(0xf2c230), white = M(0xf4f4f0);
  for (const [dx, dz] of [[-1.3, -1.3], [1.3, -1.3], [-1.3, 1.3], [1.3, 1.3]]) tower.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.4, 6), white, dx, 1.7, dz));
  tower.add(mesh(new THREE.BoxGeometry(3.4, 2.2, 3.4), blue, 0, 4.5, 0));
  tower.add(mesh(new THREE.BoxGeometry(3.6, 0.3, 3.8), yel, 0, 5.75, 0));
  tower.add(mesh(new THREE.BoxGeometry(2.6, 0.9, 0.05), new THREE.MeshBasicMaterial({ color: 0x9fd3f2 }), 0, 4.7, -1.73, false));
  tower.position.set(-17, sandY(-17, 14), 14);
}
// red & yellow flags
const flags = [];
function flag(x, z) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 4.2, 6), M(0xdddddd), 0, 2.1, 0));
  const red = mesh(new THREE.BoxGeometry(1.5, 0.5, 0.04), M(0xd62e2e), 0.78, 3.85, 0);
  const yel = mesh(new THREE.BoxGeometry(1.5, 0.5, 0.04), M(0xf5cf1c), 0.78, 3.35, 0);
  g.add(red, yel); g.position.set(x, sandY(x, z), z); beach.add(g); flags.push(g);
}
flag(-9, 4); flag(11, 4);

// umbrellas & towels
const props = new THREE.Group(); beach.add(props);
const umbCols = [0xe5484d, 0xf2b134, 0x3c8dde, 0xf1f1f1, 0x2fb59a, 0xef6fa8, 0xff8a3c];
const towelCols = [0xe5484d, 0x3c8dde, 0xf2b134, 0x7a5cd6, 0x2fb59a, 0xffffff, 0xef6fa8];
const spots = [];
const KEEP = [[-6, 58], [-3, 52], [-1, 50], [-16, 46], [-13, 41], [14, 34], [-5, 36], [-4, 62], [0, 54], [1.0, 17.5], [5.2, 14.6]];
const clear = (x, z, r = 3.2) => KEEP.every(([kx, kz]) => Math.hypot(x - kx, z - kz) > r);
for (let i = 0; i < 60; i++) {
  const x = R(-55, 55), z = R(8, 50);
  if (Math.abs(x + 17) < 4 && Math.abs(z - 14) < 4) continue;
  if (!clear(x, z, 4.5)) continue;
  spots.push([x, z]);
  const y = sandY(x, z);
  if (rnd() < 0.6) {
    const u = new THREE.Group();
    u.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 5), M(0xeeeeee), 0, 1.2, 0));
    const col = pick(umbCols);
    const c = mesh(new THREE.ConeGeometry(1.7, 0.7, 8, 1, true), M(col, { side: THREE.DoubleSide }), 0, 2.35, 0);
    u.add(c); u.position.set(x, y, z); u.rotation.z = R(-0.12, 0.12); props.add(u);
  }
  const tw = mesh(new THREE.BoxGeometry(1, 0.04, 1.9), M(pick(towelCols)), x + R(-1.2, 1.2), y + 0.03, z + 0.9, false);
  tw.receiveShadow = true; tw.rotation.y = R(-0.3, 0.3); props.add(tw);
}

// ---------- people ----------
const skins = [0xf1c7a5, 0xe0ac87, 0xc68a62, 0x9b6744, 0x6e4a33, 0xf6d3b8];
const shirts = [0xe5484d, 0x3c8dde, 0xf2b134, 0xffffff, 0x2fb59a, 0x7a5cd6, 0xef6fa8, 0x333a45, 0xff8a3c];
const shorts = [0x2b4b7c, 0x1e2a36, 0xd94b3d, 0x3b7d4c, 0x6b6b6b, 0xe9c24a, 0x1c6fa8];
const hairs = [0x2a1d14, 0x5a3a22, 0xd8b56a, 0x111111, 0x8a4b2a];
const people = [];
function makePerson(o = {}) {
  const skin = M(o.skin ?? pick(skins)), shirt = o.shirtMat ?? M(o.shirt ?? pick(shirts)), sh = M(o.shorts ?? pick(shorts));
  const root = new THREE.Group(); const body = new THREE.Group(); root.add(body);
  const s = o.scale ?? R(0.92, 1.06);
  root.scale.setScalar(s);
  const legL = new THREE.Group(), legR = new THREE.Group(); legL.position.set(-0.13, 0.9, 0); legR.position.set(0.13, 0.9, 0);
  const legMat = o.pants ? M(o.pants) : skin;
  legL.add(mesh(new THREE.CylinderGeometry(0.085, 0.07, 0.9, 6), legMat, 0, -0.45, 0));
  legR.add(mesh(new THREE.CylinderGeometry(0.085, 0.07, 0.9, 6), legMat, 0, -0.45, 0));
  body.add(legL, legR);
  body.add(mesh(new THREE.CylinderGeometry(0.2, 0.19, 0.22, 7), sh, 0, 0.98, 0));
  const torso = mesh(new THREE.CylinderGeometry(o.shirtless ? 0.19 : 0.21, 0.18, 0.58, 7), o.shirtless ? skin : shirt, 0, 1.36, 0);
  body.add(torso);
  const armL = new THREE.Group(), armR = new THREE.Group(); armL.position.set(-0.27, 1.6, 0); armR.position.set(0.27, 1.6, 0);
  const armMat = o.sleeves ? shirt : skin;

  } else if (t < 43.5) {
    const temp = lerp(-6, -18, smooth(37.6, 41, t));
    B.push({ lab: 'One week later', val: Math.round(temp) + '°C', sub: "Earth's average surface, estimated", a: 37.6, b: 43.5 });
  } else if (t < 49) {
    B.push({ lab: "Earth's orbit", val: 'None', sub: 'Flying straight on at 107,000 km/h', a: 43.8, b: 49 });
  }
  return B;
}
const SUBS = [
  [0.3, 5.4, 'Just another afternoon at Bondi.'],
  [6.6, 9.5, 'At 2:00 pm, the Sun vanishes.'],
  [11.6, 15.9, 'But its last light is still on the way.'],
  [16.6, 21.0, 'Nobody notices.'],
  [21.6, 27.8, 'Not yet.'],
  [28.25, 29.6, '8 minutes, 20 seconds later.'],
  [29.9, 32.9, '1.3 seconds after that, the Moon goes out too.'],
  [34.0, 37.4, 'Phones become the only light.'],
  [38.3, 43.4, 'A week later, Bondi is frozen.'],
  [44.4, 48.9, 'And Earth drifts off into the dark.'],
];
const alpha = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(smooth(a, a + fi, t), 1 - smooth(b - fo, b, t));
let lastHud = '';
function updateOverlay(t) {
  const B = hudBlocks(t);
  const html = B.map(b => `<div class="blk" style="opacity:${alpha(t, b.a, b.b, 0.35, 0.3).toFixed(3)}"><div class="lab">${b.lab}</div><div class="val${b.red ? ' red' : ''}">${b.val}</div><div class="sub">${b.sub}</div></div>`).join('');
  if (html !== lastHud) { hudEl.innerHTML = html; lastHud = html; }
  const s = SUBS.find(s => t >= s[0] && t < s[1]);
  if (s) { subEl.textContent = s[2]; subEl.style.opacity = alpha(t, s[0], s[1], 0.3, 0.25); } else { subEl.style.opacity = 0; }
  // end card
  if (t >= 49.3) {
    endEl.innerHTML = `<div class="a" style="opacity:${smooth(49.4, 49.9, t)}">This is fiction.</div>
      <div class="b" style="opacity:${smooth(50.9, 51.5, t)}">But the sunlight on your skin right now left the Sun <span>8 minutes 20 seconds</span> ago.</div>`;
    tagEl.textContent = '@lost_index'; tagEl.style.opacity = smooth(52, 52.6, t) * 0.85;
  } else { endEl.innerHTML = ''; tagEl.style.opacity = 0; }
  // fades between shots
  let f = 0;
  f = Math.max(f, 1 - smooth(0, 0.01, t));
  if (t >= 37.0 && t < 37.9) f = Math.max(f, t < 37.5 ? smooth(37.0, 37.5, t) : 1 - smooth(37.5, 37.9, t));
  f = Math.max(f, t >= 48.5 && t < 49.4 ? (t < 49 ? smooth(48.5, 49, t) : 1 - smooth(49, 49.4, t)) : 0);
  f = Math.max(f, smooth(54.3, 55, t));
  fadeEl.style.opacity = f;
  document.getElementById('dim').style.opacity = smooth(49.3, 50.2, t);
  document.getElementById('note').style.opacity = ((t >= 9.6 && t < 16) || (t >= 43.5 && t < 49)) ? 0.7 : 0;
  // flash when the sun goes
  flashEl.style.opacity = t >= 10.5 && t < 11.2 ? (1 - smooth(10.5, 11.2, t)) * 0.55 : 0;
}

// ================= SHOTS =================
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function beachCam(pos, look, fov = 58) { camB.position.copy(pos); camB.fov = fov; camB.updateProjectionMatrix(); camB.lookAt(look); }
function renderBeach(t, mode, peopleOpts) {
  setMode(mode, t);
  updatePeople(t, peopleOpts);
  renderer.render(beach, camB);
}
window.renderAt = function (t) {
  moon.visible = true; moonMat.opacity = 0.55; moonMat.color.set(0xe9eef6); moonGlow.material.opacity = 0;
  moon.children.forEach(c => c.material.opacity = 0.5);
  sAmb.intensity = 0.25; orbitLine.material.opacity = 0.6;
  if (t < 5.6) {                       // S1 establishing
    const k = smooth(0, 5.6, t);
    beachCam(v3(lerp(-6, -3, k), lerp(3.4, 3.0, k), lerp(58, 52, k)), v3(lerp(0, 1, k), -1, -30));
    renderBeach(t, 'day', {});
  } else if (t < 9.6) {                // S2 tilt up to the Sun
    const k = smooth(5.6, 9.4, t);
    const look = v3(0, 1, -30).lerp(SUN_DIR.clone().multiplyScalar(120).add(v3(-1, 1.7, 50)), k * 0.8);
    beachCam(v3(-1, 1.7, 50), look, lerp(58, 52, k));
    renderBeach(t, 'day', {});
  } else if (t < 16) {                 // S3 space: the Sun blinks out
    const k = smooth(9.6, 16, t);
    const ea = EA - (t - 9.6) * 0.004;
    sEarth.position.set(Math.cos(ea) * ORB, 0, Math.sin(ea) * ORB);
    const gone = t >= 10.55;
    const sc = t < 10.4 ? 1 + Math.sin(t * 3) * 0.01 : t < 10.55 ? 1 + (t - 10.4) * 3 : 0.0001;
    sSun.scale.setScalar(sc); sGlow.visible = !gone; sGlow.scale.setScalar(60 * sc);
    sPoint.intensity = 3; // Earth still lit: light already in flight
    const fl = t >= 10.5 ? Math.max(0, 1 - (t - 10.5) / 0.9) : 0;
    flashS.visible = fl > 0; flashS.scale.setScalar(20 + (t - 10.5) * 140); flashS.material.opacity = fl;
    const r = gone ? (t - 10.55) * 4.4 : 0;
    shell.visible = gone; shell.scale.setScalar(Math.max(0.01, r)); shell.material.opacity = 0.9;
    shellFill.visible = false; ghost.visible = gone; ghost.material.opacity = 0.35;
    trail.visible = false; orbitLine.visible = true;
    const cp = v3(lerp(-6, -2, k), lerp(62, 56, k), lerp(100, 90, k));
    camS.position.copy(cp); camS.lookAt(v3(-3, 0, 17));
    ghost.lookAt(camS.position);
    renderer.render(space, camS);
  } else if (t < 33) {                 // S4/S5 one continuous shot: the wait, the blackout, the Moon
    const k = smooth(16, 33, t);
    beachCam(v3(lerp(-16, -13, k), lerp(2.0, 1.8, k), lerp(46, 41, k)), v3(lerp(9, 10, k), lerp(3, 5, k), -40), 60);
    const night = t >= 28;
    renderBeach(t, night ? 'night' : 'day', { stopAt: 28.15, lookUp: smooth(28.4, 29.4, t) });
    // moon: pale by day, bright for 1.3 s after the blackout, then gone
    moon.visible = t < 29.3; moonGlow.material.opacity = night && t < 29.3 ? 1 : 0;
    moonMat.opacity = night ? 1 : 0.55; moonMat.color.set(night ? 0xf6f2e4 : 0xe9eef6);
    moon.children.forEach(c => c.material.opacity = night ? 0.7 : 0.5);
    renderer.render(beach, camB);
  } else if (t < 37.5) {               // S5b phones
    const k = smooth(33, 37.5, t);
    beachCam(v3(lerp(15, 13.5, k), 1.6, lerp(35, 33.5, k)), v3(-3, 1.4, 18), 58);
    moon.visible = false; moonGlow.material.opacity = 0;
    setMode('night', t); updatePeople(t, { stopAt: 28.15, lookUp: 1, phones: true });
    // real lights from phones near the camera
    const lit = crowd.filter(p => p.phone.visible).map(p => ({ p, d: p.root.position.distanceTo(camB.position) })).sort((a, b) => a.d - b.d).slice(0, 6);
    lit.forEach((o, i) => { const wp = new THREE.Vector3(); o.p.phone.getWorldPosition(wp); pls[i].position.copy(wp); pls[i].intensity = 6; pls[i].color.set(0xeef3ff); });
    renderer.render(beach, camB);
  } else if (t < 43.5) {               // S6 frozen
    const k = smooth(37.5, 43.5, t);
    beachCam(v3(lerp(-3, -1.5, k), lerp(2.8, 2.4, k), lerp(29, 26.5, k)), v3(3.2, 0.6, 15.5), 56);
    moon.visible = false; moonGlow.material.opacity = 0;
    setMode('frozen', t); updatePeople(t, { stopAt: 0 });
    huddle.forEach(p => { p.root.position.set(p.x0, sandY(p.x0, p.z), p.z); p.root.rotation.y = p.ry; p.body.rotation.set(0, 0, 0); p.body.position.set(0, 0, 0); p.armL.rotation.set(0, 0, 0); p.armR.rotation.set(0, 0, 0); setPose(p, p.kind, t); p.armL.rotation.x = p.armR.rotation.x = -0.9; p.head.rotation.x = 0.2; });
    guy.icecream.visible = true;
    const fk = 0.85 + 0.15 * Math.sin(t * 17) * Math.sin(t * 7.3);
    pls[0].position.set(FIRE.x, sandY(FIRE.x, FIRE.z) + 1.2, FIRE.z); pls[0].color.set(0xff9a40); pls[0].intensity = 26 * fk; pls[0].distance = 20;
    flames.forEach((f, i) => { f.scale.y = 0.8 + 0.35 * Math.abs(Math.sin(t * 9 + i * 1.7)); });
    fireGlow.material.opacity = 0.8 * fk;
    const fp = flakeGeo.attributes.position;
    for (let i = 0; i < fp.count; i++) {
      fp.setX(i, flakeBase[i * 3] + Math.sin(t * 0.5 + i) * 0.8 + t * 1.2 % 80 - 0);
      fp.setY(i, ((flakeBase[i * 3 + 1] - t * 0.6) % 22 + 22) % 22);
    }
    fp.needsUpdate = true;
    renderer.render(beach, camB);
    pls[0].distance = 14;
  } else if (t < 49) {                 // S7 Earth drifts off
    const k = smooth(43.5, 49, t);
    sSun.scale.setScalar(0.0001); sGlow.visible = false; flashS.visible = false; shell.visible = false;
    sPoint.intensity = 0; sAmb.intensity = 1.3;
    ghost.visible = true; ghost.material.opacity = 0.45;
    const p0 = v3(Math.cos(EA) * ORB, 0, Math.sin(EA) * ORB);
    const dir = v3(Math.sin(EA), 0, -Math.cos(EA)); // tangent (clockwise orbit)
    // orbit for the first moment, then straight
    const d = (t - 43.5) * 3.2;
    const pos = p0.clone().addScaledVector(dir, d);
    sEarth.position.copy(pos); sEarth.rotation.y = t * 0.3;
    trail.visible = true; trail.geometry.setFromPoints([p0, pos]); trail.computeLineDistances();
    orbitLine.visible = true; orbitLine.material.opacity = 0.35;
    camS.position.copy(pos.clone().add(v3(lerp(-4, -10, k), lerp(30, 44, k), lerp(46, 62, k))));
    camS.lookAt(pos.clone().add(v3(lerp(-2, -6, k), 0, lerp(-16, -24, k))));
    ghost.lookAt(camS.position);
    renderer.render(space, camS);
  } else {                             // S8 back to reality
    const k = smooth(49, 55, t);
    beachCam(v3(lerp(-4, 0, k), lerp(4.5, 3.8, k), lerp(62, 54, k)), v3(lerp(1, 3, k), 9, -20), 58);
    moon.visible = true; moonMat.opacity = 0.55; moonMat.color.set(0xe9eef6); moonGlow.material.opacity = 0;
    renderBeach(t, 'day', {});
  }
  updateOverlay(t);
};
window.guyScreen = () => { const v = new THREE.Vector3(); guy.head.getWorldPosition(v); v.project(camB); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, v.z]; };
window.camState = () => ({ p: camB.position.toArray(), m: camB.matrixWorldInverse.elements.slice(), pr: camB.projectionMatrix.elements.slice() });
window.ready = true;
</script>
