<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>

@font-face { font-family: IX; src: url(fonts/InterDisplay-ExtraBold.otf); }
@font-face { font-family: IB; src: url(fonts/InterDisplay-Bold.otf); }
@font-face { font-family: IS; src: url(fonts/InterDisplay-SemiBold.otf); }
@font-face { font-family: IM; src: url(fonts/InterDisplay-Medium.otf); }
@font-face { font-family: PM; src: url(fonts/IBMPlexMono-Medium.ttf); }
@font-face { font-family: PR; src: url(fonts/IBMPlexMono-Regular.ttf); }
:root { --paper: #f5f0e4; --ink: #141414; --cobalt: #2443e6; --tomato: #ff4a2e; --mint: #20c497; --lilac: #a98bff; --pink: #ff86b8; --sun: #ffcb2b; --tang: #ff8a3c; --clay: #b9774c; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
* { box-sizing: border-box; }
.a { position: absolute; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
#grain { inset: -60px; opacity: .08; mix-blend-mode: multiply; pointer-events: none; }
#hdr { left: 56px; right: 56px; top: 64px; display: flex; justify-content: space-between; font-family: PM; font-size: 26px; letter-spacing: 3px; color: var(--ink); z-index: 40; }
.chip { display: inline-block; font-family: PM; font-size: 30px; letter-spacing: 3px; padding: 10px 18px; border-radius: 10px; }
.blk { display: inline-block; padding: 0 .14em; border-radius: .08em; }
.mask { overflow: hidden; }
.card { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 6px var(--ink), 16px 18px 0 0 var(--ink); background: #fff; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cut { position: absolute; }
/* title */
#title { left: 60px; right: 40px; top: 300px; }
#title .k { font-family: PM; font-size: 40px; letter-spacing: 6px; margin-bottom: 18px; color: var(--ink); }
#title .l { font-family: IK; font-size: 118px; line-height: 1.08; letter-spacing: -3px; color: var(--ink); white-space: nowrap; }
#title .l > span { display: inline-block; }
/* globe */
#globe { left: 0; top: 0; width: 1080px; height: 1920px; }
.cap { position: absolute; left: 60px; right: 60px; text-align: center; }
.cap span { font-family: IX; font-size: 58px; line-height: 1.34; padding: 2px 16px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 10px; }
/* descent */
#desc { inset: 0; overflow: hidden; }
#strata { left: 0; top: 0; width: 1080px; }
.layer { position: absolute; left: 0; width: 1080px; }
#shaft { left: 390px; width: 300px; top: 0; height: 1920px; background: rgba(20,20,20,.88); }
#lines { inset: 0; }
.hud { position: absolute; font-family: PM; color: #fff; text-shadow: none; }
.hud .lab { font-size: 24px; letter-spacing: 4px; opacity: .9; }
.hud .val { font-family: IK; font-size: 76px; letter-spacing: -1px; line-height: 1; margin-top: 6px; }
.hudbox { position: absolute; background: var(--ink); color: #fff; border-radius: 18px; padding: 18px 24px; }
#lname { left: 60px; right: 60px; top: 1420px; }
#lname .n { font-family: IK; font-size: 110px; line-height: .95; letter-spacing: -3px; }
#lname .d { font-family: IS; font-size: 44px; margin-top: 14px; line-height: 1.2; }
/* kola */
#kola { inset: 0; background: var(--cobalt); }
#kk { left: 60px; top: 220px; font-family: PM; font-size: 36px; letter-spacing: 4px; color: #fff; }
#kn { left: 60px; top: 1210px; font-family: IK; font-size: 170px; letter-spacing: -5px; color: var(--sun); line-height: 1; }
#kt { left: 60px; right: 60px; top: 1400px; font-family: IS; font-size: 44px; color: #fff; line-height: 1.25; }
#kbar { left: 60px; width: 960px; top: 1560px; height: 70px; border-radius: 35px; background: #fff; box-shadow: 0 0 0 5px var(--ink); overflow: hidden; }
#kfill { left: 0; top: 0; bottom: 0; background: var(--tomato); }
#kbl { left: 60px; right: 60px; top: 1650px; display: flex; justify-content: space-between; font-family: PM; font-size: 26px; color: #fff; letter-spacing: 2px; }
#ktip { left: 60px; top: 1700px; font-family: IX; font-size: 46px; color: var(--sun); }
/* end */
#end { inset: 0; background: var(--paper); }
#end .k { position: absolute; left: 64px; top: 560px; font-family: PM; font-size: 44px; letter-spacing: 4px; color: var(--ink); }
#end .big { position: absolute; left: 64px; right: 50px; top: 650px; font-family: IK; font-size: 104px; line-height: 1.04; letter-spacing: -3px; color: var(--ink); }
#end .foot { position: absolute; left: 64px; right: 64px; top: 1330px; font-family: PR; font-size: 28px; line-height: 1.5; letter-spacing: 1px; color: #555; }
#flash { inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>

  [25.7, 28.0, 'THE CENTRE', 'Weightless. 19 minutes in, ≈36,000 km/h.', 'var(--ink)', '#fff'],
];
const fmtT = m => { const s = Math.round(m * 60); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

// ---- timeline ----
const T = { s1: [0, 4.5], s2: [4.5, 10.0], s3: [10.0, 13.0], s4: [13.0, 31.6], s5: [31.6, 36.6], s6: [36.6, 44.6], s7: [44.6, 50.0] };
const inS = (t, k) => t >= T[k][0] && t < T[k][1];

function S1(t) {
  ['#ta', '#tb', '#tc', '#td'].forEach((s, i) => {
    const ex = E.expoIn(P(t, 3.9 + i * .06, 4.4 + i * .06));
    $(s).style.transform = `translate(${Math.sin(t * 1.4 + i * 1.7) * 6}px, ${-ex * 130}%)`;
  });
  const bob = Math.sin(t * 2.2) * 18;
  const dive = E.expoIn(P(t, 3.7, 4.45));
  $('#d1').style.transform = `translate(${-dive * 300}px, ${bob + dive * 900}px) rotate(${28 + Math.sin(t * 1.3) * 6 + dive * 10}deg)`;
  $('#s1earth').style.transform = `translateY(${Math.sin(t * .8) * 8 + dive * 200}px)`;
}

function S2(t) {
  const t0 = T.s2[0];
  frameSeq($('#sydimg'), 'sydney', t, t0);
  const ci = E.back(P(t, t0, t0 + 0.6));
  const shrink = E.io(P(t, t0 + 2.4, t0 + 3.1));
  $('#syd').style.transform = `translate(${(1 - ci) * 900 - shrink * 70}px, ${-shrink * 40}px) rotate(${lerp(-3, -6, shrink)}deg) scale(${lerp(1, .36, shrink)})`;
  $('#syd').style.transformOrigin = '0 0';
  $('#sydchip').style.opacity = P(t, t0 + 0.5, t0 + 0.7) * (1 - P(t, t0 + 2.3, t0 + 2.5));
  $('#sydchip').style.transform = `translateY(${(1 - E.expo(P(t, t0 + 0.5, t0 + 1))) * 40}px)`;
  const gi = E.back(P(t, t0 + 2.7, t0 + 3.3));
  $('#gl').setAttribute('transform', `translate(540,1000) scale(${gi})`);
  const lk = E.io(P(t, t0 + 3.2, t0 + 4.4));
  const L = 780; $('#gline').style.strokeDasharray = `26 18`; $('#gline').setAttribute('y2', -390 + 780 * lk);
  $('#gend').style.opacity = lk > .98 ? 1 : 0;
  $('#glab').style.opacity = P(t, t0 + 3.0, t0 + 3.3);
  $('#gl2').style.opacity = lk > .9 ? 1 : 0;
  $('#gdist').style.opacity = P(t, t0 + 3.2, t0 + 3.4);
  $('#gdt').textContent = fmt(12742 * lk) + ' km';
  $('#globe').style.opacity = gi > 0 ? 1 : 0;
  const c = t >= t0 + 3.3 ? 'Straight down. 12,742 km to the other side.' : '';
  $('#cap2').innerHTML = c ? `<span style="background:var(--sun)">${c}</span>` : '';
  $('#cap2').style.opacity = E.expo(P(t, t0 + 3.3, t0 + 3.7));
  const ex = E.expoIn(P(t, T.s2[1] - .45, T.s2[1]));
  $('#s2').style.transform = `translateY(${-ex * 1920}px)`;
}

function S3(t) {
  const t0 = T.s3[0];
  const seq = [['3', 'var(--pink)'], ['2', 'var(--sun)'], ['1', 'var(--mint)'], ['JUMP!', 'var(--tomato)']];
  const idx = Math.min(3, Math.floor((t - t0) / 0.55));
  const lk = P(t, t0 + idx * .55, t0 + idx * .55 + .3);
  const [txt, col] = seq[idx];
  $('#cd').innerHTML = `<span class="blk" style="background:${col};color:var(--ink);font-size:${idx === 3 ? 230 : 330}px">${txt}</span>`;
  $('#cd').style.transform = `scale(${E.back(lk)}) rotate(${(idx % 2 ? -1 : 1) * 4}deg)`;
  $('#cd').style.opacity = 1 - P(t, t0 + 2.5, t0 + 2.7);
  $('#rules').style.transform = `translateX(${(1 - E.expo(P(t, t0, t0 + .5))) * -900}px)`;
  // diver: crouch bob, jump up at 2.2, dive into hole
  let y = 900 + Math.sin(t * 6) * 10, r = -10, x = 330;
  if (t > t0 + 2.15) { const k = P(t, t0 + 2.15, t0 + 2.45); y = 900 - E.out(k) * 260; r = lerp(-10, 120, k); }
  if (t > t0 + 2.45) { const k = E.expoIn(P(t, t0 + 2.45, t0 + 3.0)); y = 640 + k * 1100; r = 118; x = 330 + k * 0; }
  $('#d3').style.transform = `translate(${x - 330}px, ${y - 900}px) rotate(${r}deg)`;
}

function S4(t) {
  const t0 = T.s4[0];
  let depth, speed, mins, rising = false;
  if (t < 25.6) { mins = storyMinAt(t); [depth, speed] = atMin(mins); }
  else if (t < 28.0) { mins = TC + (t - 25.6) * 0.15; depth = 6371; speed = TAB[TAB.length - 1][2]; }
  else { // rise: mirror of the fall, compressed 28.0 -> 31.3
    rising = true; const k = E.io(P(t, 28.0, 31.3)); const m = TC * (1 - k); [depth, speed] = atMin(m); mins = 2 * TC - m;
  }
  const camY = vy(depth) + 2000 - 820;
  $('#strata').style.transform = `translateY(${-camY}px)`;
  $('#shaft').style.opacity = 1;
  $('#vT').textContent = fmtT(mins);
  $('#vD').textContent = rising ? fmt(depth) + ' km' : fmt(depth) + ' km';
  $('#vS').textContent = fmt(speed) + ' km/h';
  $('#hD').querySelector('.lab').textContent = rising ? 'DEPTH (CLIMBING)' : 'DEPTH';
  // diver
  const atC = t >= 25.6 && t < 28.0;
  $('#d4').src = atC ? 'img/float.png' : 'img/diver.png';
  const wob = Math.sin(t * 9) * (atC ? 0 : 4);
  const rot = atC ? Math.sin(t * 1.5) * 25 : (rising ? 28 + 180 : 28) + wob * .5;
  const fy = atC ? Math.sin(t * 2) * 30 : 0;
  $('#d4').style.transform = `translateY(${fy}px) rotate(${rot}deg) scale(${atC ? 1.1 : 1})`;
  // speed lines
  const sp = speed / 36000; let h = '';
  for (let i = 0; i < 26; i++) {
    const x = 400 + hash(i) * 280, len = 60 + sp * 360, ph = (t * (0.4 + sp * 3.2) + hash(i + 5)) % 1;
    const y = rising ? 1920 - ph * 2400 : ph * 2400 - 400;
    h += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + (rising ? len : -len)}" stroke="rgba(255,255,255,${.25 + sp * .5})" stroke-width="5" stroke-linecap="round"/>`;
  }
  $('#lines').innerHTML = atC ? '' : h;
  // layer names
  const L = LNAMES.find(l => t >= l[0] && t < l[1]);
  if (L && !rising) {
    const k = E.expo(P(t, L[0], L[0] + .45)), o = 1 - P(t, L[1] - .25, L[1]);
    $('#ln').innerHTML = `<span class="blk" style="background:${L[4]};color:${L[5]}">${L[2]}</span>`;
    $('#ld').innerHTML = `<span class="blk" style="background:${L[4]};color:${L[5]};font-size:42px;line-height:1.5;box-decoration-break:clone;-webkit-box-decoration-break:clone">${L[3]}</span>`;
    $('#lname').style.opacity = o; $('#lname').style.transform = `translateX(${(1 - k) * -700}px)`;
  } else if (rising) {
    const k = E.expo(P(t, 28.2, 28.7)), o = 1 - P(t, 31.0, 31.4);
    $('#ln').innerHTML = `<span class="blk" style="background:var(--mint);color:var(--ink)">AND UP…</span>`;
    $('#ld').innerHTML = `<span class="blk" style="background:var(--ink);color:#fff;font-size:42px;line-height:1.5">You slow down all the way to the far side.</span>`;
    $('#lname').style.opacity = o; $('#lname').style.transform = `translateX(${(1 - k) * 700}px)`;
  } else $('#lname').style.opacity = 0;
  const hk = E.back(P(t, t0, t0 + .5));
  ['#hT', '#hD', '#hS'].forEach((s, i) => $(s).style.transform = `scale(${E.back(P(t, t0 + i * .12, t0 + .5 + i * .12))})`);
  $('#flash').style.opacity = (t >= 25.6 && t < 25.8 ? (1 - (t - 25.6) / .2) * .8 : 0);
  const ex = E.expoIn(P(t, 31.2, 31.6)); $('#desc').style.transform = `translateY(${-ex * 1920}px)`;
}

function S5(t) {
  const t0 = T.s5[0];
  frameSeq($('#atlimg'), 'atlantic', t, t0);
  const ci = E.back(P(t, t0, t0 + .6));
  $('#atl').style.transform = `translateY(${(1 - ci) * 1400}px) rotate(${lerp(10, 3, ci) + Math.sin(t) * .6}deg)`;
  $('#atlchip').style.opacity = P(t, t0 + .5, t0 + .7); $('#atlchip').style.transform = `translateY(${(1 - E.expo(P(t, t0 + .5, t0 + 1))) * 40}px)`;
  const caps = [[t0 + 1.0, t0 + 3.0, '≈480 km southwest of the Azores.', 'var(--sun)'], [t0 + 3.0, T.s5[1], 'Then you fall back in. Forever.', 'var(--mint)']];
  const c = caps.find(c => t >= c[0] && t < c[1]);
  $('#cap5').innerHTML = c ? `<span style="background:${c[3]}">${c[2]}</span>` : '';
  $('#cap5').style.opacity = c ? E.expo(P(t, c[0], c[0] + .3)) : 0;
  const ex = E.expoIn(P(t, T.s5[1] - .4, T.s5[1])); $('#s5').style.transform = `translateX(${-ex * 1080}px)`;
}

function S6(t) {
  const t0 = T.s6[0];
  frameSeq($('#kolaimg'), 'kola', t, t0);
  const si = E.expo(P(t, t0, t0 + .5)); $('#kola').style.transform = `translateX(${(1 - si) * 1080}px)`;
  $('#kk').textContent = typed('BACK TO REALITY. THE DEEPEST HOLE EVER DUG:', t, t0 + .3, 34);
  const ci = E.back(P(t, t0 + .6, t0 + 1.2));
  $('#kc').style.transform = `scale(${ci}) rotate(${-4 + Math.sin(t * .9) * .8}deg)`;
  const gi = E.spring(P(t, t0 + 1.6, t0 + 2.6));
  $('#guy').style.transform = `translateY(${(1 - gi) * -400}px) rotate(${8 + Math.sin(t * 2) * 3}deg)`; $('#guy').style.opacity = P(t, t0 + 1.6, t0 + 1.7);
  const nk = E.out(P(t, t0 + 1.4, t0 + 2.8));
  $('#kn').textContent = fmt(12262 * nk) + ' m'; $('#kn').style.opacity = P(t, t0 + 1.3, t0 + 1.5);
  $('#kt').innerHTML = t > t0 + 2.6 ? 'Kola Superdeep Borehole, Russia, 1989.<br>They stopped when the rock hit ≈180 °C.' : '';
  $('#kt').style.opacity = E.out(P(t, t0 + 2.6, t0 + 3.0));
  const bk = E.io(P(t, t0 + 4.0, t0 + 5.0));
  $('#kbar').style.opacity = P(t, t0 + 3.8, t0 + 4.0); $('#kbl').style.opacity = P(t, t0 + 3.8, t0 + 4.0);
  $('#kfill').style.width = (bk * 0.0019 * 960 + bk * 6) + 'px';
  $('#ktip').innerHTML = t > t0 + 5.0 ? `That’s about <span class="blk" style="background:var(--sun);color:var(--ink)">0.2%</span> of the way to the centre.` : '';
  $('#ktip').style.opacity = E.out(P(t, t0 + 5.0, t0 + 5.4)); $('#ktip').style.color = '#fff';
  const ex = E.expoIn(P(t, T.s6[1] - .4, T.s6[1])); $('#kola').style.opacity = 1 - ex;
}

function S7(t) {
  const t0 = T.s7[0];
  $('#ek').textContent = typed('THIS IS FICTION.', t, t0 + .1, 24);
  ['#e1', '#e2', '#e3', '#e4'].forEach((s, i) => { const k = E.expo(P(t, t0 + .8 + i * .14, t0 + 1.3 + i * .14)); $(s).style.transform = `translateY(${(1 - k) * 110}%)`; });
  $('#efoot').innerHTML = 'Idealised: no air, no friction, tunnel through the centre.<br>Times and speeds: our calculation (PREM Earth model; Klotz, 2015).<br><br>what if no. 04 · @lost_index';
  $('#efoot').style.opacity = P(t, t0 + 1.8, t0 + 2.2);
  const dk = E.spring(P(t, t0 + 1.2, t0 + 2.4));
  $('#dend').style.transform = `translateY(${(1 - dk) * 600 + Math.sin(t * 2) * 14}px) rotate(${Math.sin(t * 1.2) * 10}deg)`;
  $('#stage').style.opacity = 1 - P(t, 49.6, 50.0);
}

window.renderAt = function (t) {
  show('#s1', inS(t, 's1')); show('#s2', inS(t, 's2')); show('#s3', inS(t, 's3')); show('#desc', inS(t, 's4'));
  show('#s5', inS(t, 's5')); show('#kola', inS(t, 's6')); show('#end', t >= T.s7[0]);
  const darkHdr = inS(t, 's3') || inS(t, 's6');
  $('#hdr').style.color = darkHdr ? '#fff' : 'var(--ink)';
  $('#hdr').style.opacity = inS(t, 's4') ? 0 : 1;
  if (inS(t, 's1')) S1(t);
  if (inS(t, 's2')) S2(t);
  if (inS(t, 's3')) S3(t);
  if (inS(t, 's4')) S4(t); else $('#flash').style.opacity = 0;
  if (inS(t, 's5')) S5(t);
  if (inS(t, 's6')) S6(t);
  if (t >= T.s7[0]) S7(t); else $('#stage').style.opacity = 1;
  const f = Math.floor(t * 24); $('#grain').style.transform = `translate(${-hash(f) * 50}px, ${-hash(f + 3) * 50}px)`;
  const ps = PEND.splice(0); return Promise.all(ps).then(() => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0))));
};
Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => { window.ready = true; });
</script>
</body>
</html>
