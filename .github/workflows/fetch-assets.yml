# Downloads public-domain / openly licensed source images listed in fetch/*.txt
# into the repo, so the render pipeline (which can't reach archive hosts) can use them.
# Each line: <destination path in repo> <url>   (lines starting with # are ignored)
name: fetch-assets
on:
  push:
    paths: ["fetch/*.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed files
        run: |
          set -u
          ok=0; fail=0
          : > fetch/last_run.log
          for list in fetch/*.txt; do
            while read -r dest url; do
              [ -z "${dest:-}" ] && continue
              case "$dest" in \#*) continue;; esac
              [ -s "$dest" ] && continue
              mkdir -p "$(dirname "$dest")"
              UA="lost-index-media-fetcher/1.0 (https://github.com/cmulia/lost-index-media; asset fetch for attribution-credited videos)"
              code=$(curl -sSL --retry 3 --retry-delay 5 -A "$UA" -o "$dest" -w "%{http_code}" "$url" || echo 000)
              if [ "$code" != "200" ]; then
                # Wikimedia thumb sizes are restricted; fall back to the original file
                orig=$(echo "$url" | sed -E 's#/thumb/(.*)/[0-9]+px-[^/]+$#/\1#')
                if [ "$orig" != "$url" ]; then
                  code=$(curl -sSL --retry 3 --retry-delay 5 -A "$UA" -o "$dest" -w "%{http_code}" "$orig" || echo 000)
                fi
              fi
              if [ "$code" = "200" ] && [ -s "$dest" ]; then
                echo "ok   $dest" >> fetch/last_run.log; ok=$((ok+1))
              else
                echo "FAIL $code $dest $url" >> fetch/last_run.log; rm -f "$dest"; fail=$((fail+1))
              fi
              sleep 1
            done < "$list"
          done
          echo "ok=$ok fail=$fail" | tee -a fetch/last_run.log
      - name: Commit
        run: |
          git config user.name "lost-index-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fetch source assets [skip ci]"
          git push
